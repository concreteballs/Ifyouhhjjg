name: Spectral Core tests

on:
  push:
    paths:
      - "spectral_core/**"
      - "tests/**"
      - ".github/workflows/spectral-core-tests.yml"
  pull_request:
    paths:
      - "spectral_core/**"
      - "tests/**"
      - ".github/workflows/spectral-core-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
