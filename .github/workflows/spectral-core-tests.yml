name: Spectral Core tests

on:
  push:
    paths:
      - "spectral_core/**"
      - "spectral_monitor/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "PROVENANCE.md"
      - "LICENSE"
      - ".github/workflows/spectral-core-tests.yml"
  pull_request:
    paths:
      - "spectral_core/**"
      - "spectral_monitor/**"
      - "tests/**"
      - ".github/workflows/spectral-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
